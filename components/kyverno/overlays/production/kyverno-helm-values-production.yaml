# Production-specific Kyverno configuration
# This extends the base configuration with production-specific settings

# Production admission controller configuration
admissionController:
  replicas: 3
  initContainer:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 100m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
        - "ALL"
  container:
    extraArgs:
      leaderElectionRetryPeriod: 26s
    # Default production resources - can be overridden by cluster-specific patches
    resources:
      requests:
        cpu: 4000m
        memory: 2Gi
      limits:
        cpu: 4000m
        memory: 2Gi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
        - "ALL"
  metering:
    disabled: false
  serviceMonitor:
    enabled: true
    secure: false

# Production background controller configuration
backgroundController:
  replicas: 3
  extraArgs:
    leaderElectionRetryPeriod: 26s
  # Default production resources - can be overridden by cluster-specific patches
  resources:
    requests:
      cpu: 4000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 2Gi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
      - "ALL"
  metering:
    disabled: false
  serviceMonitor:
    enabled: true
    secure: false

# Production cleanup controller configuration
cleanupController:
  replicas: 3
  extraArgs:
    leaderElectionRetryPeriod: 26s
  # Default production resources - can be overridden by cluster-specific patches
  resources:
    requests:
      cpu: 500m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 128Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
      - "ALL"
  metering:
    disabled: false
  serviceMonitor:
    enabled: true
    secure: false
