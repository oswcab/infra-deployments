---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: konflux-oauth-proxy-generator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: konflux-oauth-proxy-generator-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - list
  - create
  - get
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: konflux-oauth-proxy-generator-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: konflux-oauth-proxy-generator-role
subjects:
- kind: ServiceAccount
  name: konflux-oauth-proxy-generator
  namespace: konflux-ui
---
apiVersion: batch/v1
kind: Job
metadata:
  name: konflux-generate-oauth-proxy-secrets
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  template:
    spec:
      containers:
      - command:
        - /bin/bash
        - -c
        - |
          set -o errexit
          set -o nounset
          set -o pipefail

          # Get namespace
          namespace="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"

          # Use /tmp for temp files (writable even with readOnlyRootFilesystem)
          TEMP_DIR="/tmp"
          trap 'rm -f "$TEMP_DIR"/secret-*.yaml' EXIT

          # Function to generate and apply secret
          generate_secret() {
            local secret_name="$1"
            local secret_key="$2"
            local bytes="$3"
            local temp_file="$TEMP_DIR/secret-${secret_name}.yaml"

            echo "Generating/updating $secret_name"

            local random_pass
            random_pass=$(openssl rand -base64 "$bytes")

            kubectl create secret generic "$secret_name" \
              --namespace "$namespace" \
              --from-literal="${secret_key}=${random_pass}" \
              --dry-run=client \
              -o yaml > "$temp_file"

            kubectl apply -f "$temp_file"

            # Clear sensitive data
            unset random_pass
            rm -f "$temp_file"
          }

          # Function to restart deployment if it exists
          restart_deployment() {
            local deployment="$1"

            echo "Restarting $deployment deployment"
            if kubectl -n "$namespace" get "deployment/$deployment" &>/dev/null; then
              kubectl -n "$namespace" rollout restart "deployment/$deployment"
            else
              echo "Skipping $deployment restart (deployment not found)"
            fi
          }

          # Generate secrets
          generate_secret "oauth2-proxy-cookie-secret" "cookie-secret" 16
          generate_secret "oauth2-proxy-client-secret" "client-secret" 20

          # Restart deployments
          restart_deployment "proxy"
          restart_deployment "dex"

          echo "Secret rotation completed successfully"

        image: quay.io/konflux-ci/appstudio-utils@sha256:d664804b2b4cc1415e16fe828a9f520a9db1dd041f52853524cd19e4bec75c0a
        imagePullPolicy: Always
        name: konflux-oauth-client-secret-generation
        resources:
          limits:
            cpu: 100m
            memory: 512Mi
          requests:
            cpu: 10m
            memory: 128Mi
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      dnsPolicy: ClusterFirst
      restartPolicy: Never
      serviceAccountName: konflux-oauth-proxy-generator
      terminationGracePeriodSeconds: 30
